[package]
name = "auler"
description = "학과 사무실용 경량 시간표 제작 도구"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 메모리를 줄이려고 GPU 렌더러(OpenGL)를 빼고 소프트웨어 렌더러만 쓴다.
# 실측(릴리스, 시간표 화면): GPU 렌더러 Private 98MB, 소프트웨어 렌더러 21MB.
slint = { version = "1.19.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "software-renderer-path",
    "accessibility",
] }
sys-locale = "0.3.2"

[build-dependencies]
slint-build = "1.19.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
i-slint-backend-testing = { version = "1.19.1", features = ["renderer-software"] }
png = "0.18.1"
