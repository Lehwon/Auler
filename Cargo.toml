[workspace]
resolver = "3"
members = ["app", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Lehwon/Auler"

[workspace.dependencies]
auler-domain = { path = "crates/auler-domain" }
auler-samples = { path = "crates/auler-samples" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
